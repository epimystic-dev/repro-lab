[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doicheck"
version = "0.1.0"
description = "Offline linter for DOI, arXiv, ORCID, and ISBN identifiers plus BibTeX hygiene - zero network, zero dependencies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["doi", "arxiv", "orcid", "isbn", "bibtex", "linter", "reproducibility"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]

[project.scripts]
doicheck = "doicheck.cli:main"

[tool.setuptools.packages.find]
include = ["doicheck*"]
exclude = ["tests*", "examples*"]
