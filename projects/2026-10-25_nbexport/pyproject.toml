[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nbexport"
version = "0.1.0"
description = "Lint Jupyter notebooks for execution-order defects and emit a .py script in linear or recorded execution order."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["jupyter", "notebook", "reproducibility", "linter", "nbformat"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
nbexport = "nbexport.cli:main"

[tool.setuptools.packages.find]
include = ["nbexport*"]
exclude = ["tests*", "examples*"]
